<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jot</title>
    <!-- Google Fonts: match wurkflo.app/jot with system fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          "Instrument Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      h1 {
        font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #18181b;
          color: #fafafa;
        }
      }
      .card {
        max-width: 320px;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.45);
        margin-bottom: 12px;
      }
      .mark svg {
        width: 18px;
        height: 18px;
        color: #fff;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      p {
        font-size: 12px;
        line-height: 1.55;
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"
          />
          <path d="M20 3v4" />
          <path d="M22 5h-4" />
        </svg>
      </span>
      <h1>Jot can't work on this page.</h1>
      <p>
        Chrome blocks extensions on this page. Open a regular website, click into a
        text field or select some text, then press the Jot shortcut.
      </p>
    </main>
  </body>
</html>

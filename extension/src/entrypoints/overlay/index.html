<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jot</title>
    <!-- Google Fonts: match wurkflo.app/jot with system fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      No inline scripts here: extension pages run under `script-src 'self'`
      (no 'unsafe-inline'), so inline <script> is blocked. The system theme is
      applied by main.tsx (lib/theme.ts) before React renders.
    -->
    <!--
      Boot skeleton: first paint before the JS bundle parses, React mounts,
      or the host handshake lands. Zero-JS shimmer in the compact panel
      geometry so the card never flashes blank on cold opens. React renders
      into the separate #root node; App removes #jot-boot on mount.
      Inline <style> is allowed (`style-src` includes 'unsafe-inline').
      System font stack only: this must paint before the webfont CSS above.
    -->
    <style>
      #jot-boot {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 12px 10px;
        border-radius: 14px;
        border: 1px solid #e8e8ec;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #jot-boot .jot-boot-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      #jot-boot .jot-boot-logo {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: #e2e2e8;
      }
      #jot-boot .jot-boot-title {
        width: 64px;
        height: 12px;
        border-radius: 6px;
        background: #e2e2e8;
      }
      #jot-boot .jot-boot-line {
        height: 12px;
        border-radius: 6px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #e8e8ee 25%, #f4f4f7 50%, #e8e8ee 75%);
        background-size: 200% 100%;
        animation: jot-boot-shimmer 1.2s linear infinite;
      }
      #jot-boot .jot-boot-input {
        height: 32px;
        border-radius: 8px;
        margin-top: 10px;
        background: #efeff3;
      }
      @keyframes jot-boot-shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-color-scheme: dark) {
        #jot-boot {
          border-color: #2e2e34;
          background: #1c1c1f;
        }
        #jot-boot .jot-boot-logo,
        #jot-boot .jot-boot-title {
          background: #34343b;
        }
        #jot-boot .jot-boot-line {
          background: linear-gradient(90deg, #2c2c32 25%, #3b3b42 50%, #2c2c32 75%);
          background-size: 200% 100%;
        }
        #jot-boot .jot-boot-input {
          background: #26262b;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #jot-boot .jot-boot-line {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="jot-boot" aria-hidden="true">
      <div class="jot-boot-row">
        <div class="jot-boot-logo"></div>
        <div class="jot-boot-title"></div>
      </div>
      <div class="jot-boot-line" style="width: 92%"></div>
      <div class="jot-boot-line" style="width: 80%"></div>
      <div class="jot-boot-line" style="width: 60%"></div>
      <div class="jot-boot-input"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
